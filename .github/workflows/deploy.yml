name: Build and deploy

on:
  schedule:
    # Every hour, plus every 15 minutes in the evening when most games end
    # (00:00–05:59 UTC is 6pm–midnight Central, give or take daylight saving).
    - cron: '7 * * * *'
    - cron: '*/15 0-5 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Finished box scores never change, so keep them between runs
      # instead of downloading every game again.
      - name: Restore box score cache
        uses: actions/cache@v4
        with:
          path: data/boxes
          key: boxes-${{ github.run_id }}
          restore-keys: boxes-

      - run: npm run fetch
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
